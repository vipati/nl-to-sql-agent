[project]
name = "nl-to-sql-agent"
version = "0.2.0"
description = "Natural-language questions to guarded, read-only SQL, with self-correction and an execution-accuracy eval."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Vivek Patil" }]
keywords = ["nl-to-sql", "text-to-sql", "llm", "sql-safety", "duckdb", "fastapi", "evaluation"]
dependencies = [
    "duckdb>=1.4.0",
    "fastapi>=0.125.0",
    "pydantic>=2.12.0",
    "pandas>=2.3.0",
    "sqlglot>=28.0.0",
    "streamlit>=1.52.0",
    "typer>=0.20.0",
    "uvicorn>=0.38.0",
]

[project.urls]
Repository = "https://github.com/vipati/nl-to-sql-agent"

[project.scripts]
nl-to-sql = "nl_to_sql_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx2>=0.28.0",
    "pytest>=9.0.0",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
